<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>儿童数学能力综合测评表</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0f172a;
  color: #f1f5f9;
  line-height: 1.5;
  padding: 12px;
  min-height: 100vh;
  -webkit-text-size-adjust: 100%;
}
.container {
  max-width: 800px;
  margin: 0 auto;
}

/* Header */
.header {
  text-align: center;
  background: rgba(30, 41, 59, 0.8);
  border-radius: 12px;
  padding: 20px 16px;
  margin-bottom: 16px;
  border: 1px solid rgba(99, 179, 237, 0.2);
}
.header h1 {
  font-size: 1.4rem;
  color: #63b3ed;
  margin-bottom: 4px;
}
.header p {
  font-size: 0.9rem;
  color: #94a3b8;
}

/* Stats */
.stats {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.stat {
  flex: 1;
  background: rgba(30, 41, 59, 0.8);
  border-radius: 8px;
  padding: 12px 8px;
  text-align: center;
  border: 1px solid rgba(99, 179, 237, 0.2);
}
.stat .label {
  font-size: 0.75rem;
  color: #94a3b8;
  margin-bottom: 4px;
}
.stat .value {
  font-size: 1.5rem;
  font-weight: bold;
  color: #63b3ed;
}

/* Assessment Items - MOBILE FIRST */
.assessment-item {
  background: rgba(30, 41, 59, 0.8);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid rgba(99, 179, 237, 0.2);
}

.item-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.item-icon {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  background: linear-gradient(135deg, #63b3ed, #3182ce);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  flex-shrink: 0;
}
.item-info h3 {
  font-size: 1rem;
  margin-bottom: 2px;
  color: #f1f5f9;
}
.item-info p {
  font-size: 0.8rem;
  color: #94a3b8;
}

/* Input rows */
.input-row {
  margin-bottom: 12px;
}
.input-row:last-child {
  margin-bottom: 0;
}
.input-row label {
  display: block;
  font-size: 0.85rem;
  color: #cbd5e1;
  margin-bottom: 6px;
  font-weight: 500;
}
.input-row input {
  width: 100%;
  padding: 12px;
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid rgba(99, 179, 237, 0.4);
  border-radius: 8px;
  color: #f1f5f9;
  font-size: 1rem;
  -webkit-appearance: none;
  appearance: none;
}
.input-row input:focus {
  outline: none;
  border-color: #63b3ed;
  box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.2);
}

/* Score and auto-rating */
.score-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.score-cell {
  flex: 1;
}
.score-cell .auto-score {
  background: rgba(99, 179, 237, 0.1);
  border-radius: 8px;
  padding: 12px;
  text-align: center;
  font-size: 1.2rem;
  font-weight: bold;
  color: #63b3ed;
}

/* Results */
.results {
  margin-top: 20px;
}
.result-card {
  background: rgba(30, 41, 59, 0.8);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid rgba(99, 179, 237, 0.2);
}
.result-card h3 {
  font-size: 1.1rem;
  color: #63b3ed;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Total score */
.total-score {
  text-align: center;
  padding: 20px 0;
}
.total-score .big-number {
  font-size: 3rem;
  font-weight: bold;
  color: #63b3ed;
  line-height: 1;
}
.total-score .label {
  color: #94a3b8;
  margin-top: 4px;
}

/* Analysis */
.analysis-section {
  margin-bottom: 16px;
}
.analysis-section:last-child {
  margin-bottom: 0;
}
.analysis-section h4 {
  font-size: 0.95rem;
  color: #f1f5f9;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.analysis-section .content {
  background: rgba(15, 23, 42, 0.6);
  border-radius: 8px;
  padding: 12px;
  font-size: 0.9rem;
  color: #cbd5e1;
  border-left: 3px solid #63b3ed;
}

/* Footer */
.footer {
  margin-top: 20px;
  padding: 16px;
  background: rgba(30, 41, 59, 0.8);
  border-radius: 12px;
  text-align: center;
  border: 1px solid rgba(99, 179, 237, 0.2);
}
.buttons {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.btn {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
}
.btn-primary {
  background: linear-gradient(135deg, #63b3ed, #3182ce);
  color: white;
}
.btn-secondary {
  background: rgba(255,255,255,0.1);
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
}

/* Mobile detection badge */
#mobile-badge {
  position: fixed;
  bottom: 10px;
  right: 10px;
  background: #10b981;
  color: white;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  z-index: 1000;
}

/* Desktop specific */
@media (min-width: 768px) {
  body { padding: 24px; }
  .header h1 { font-size: 1.8rem; }
  .header p { font-size: 1rem; }
  .item-info h3 { font-size: 1.1rem; }
  .input-row label { font-size: 0.9rem; }
  #mobile-badge { display: none; }
}
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>📱 数学能力测评（移动端测试版）</h1>
    <p>专为手机优化 · 全功能保留</p>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat" id="stat-total">
      <div class="label">总分</div>
      <div class="value">0</div>
    </div>
    <div class="stat" id="stat-level">
      <div class="label">等级</div>
      <div class="value">--</div>
    </div>
    <div class="stat" id="stat-avg">
      <div class="label">平均正确率</div>
      <div class="value">0%</div>
    </div>
  </div>

  <!-- Assessment Items -->
  <div id="items-container"></div>

  <!-- Results -->
  <div class="results">
    <!-- Total Score -->
    <div class="result-card total-score">
      <h3>🏆 综合成绩</h3>
      <div class="big-number" id="final-total">0</div>
      <div class="label">/ 120 分</div>
      <div style="margin-top: 12px; padding: 8px 16px; background: rgba(99,179,237,0.1); border-radius: 20px; display:inline-block;">
        <strong id="final-level">待测评</strong>
      </div>
    </div>

    <!-- Analysis -->
    <div class="result-card">
      <h3>📊 智能分析</h3>
      <div class="analysis-section">
        <h4>✅ 优势能力</h4>
        <div class="content" id="analysis-strength">填写数据后自动分析</div>
      </div>
      <div class="analysis-section">
        <h4>⚠️ 待提升领域</h4>
        <div class="content" id="analysis-weakness">填写数据后自动分析</div>
      </div>
      <div class="analysis-section">
        <h4>💡 训练建议</h4>
        <div class="content" id="analysis-suggestion">填写数据后生成建议</div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div style="color: #94a3b8; font-size: 0.85rem;">
      <span>🕒 实时更新 · 自动计算</span>
    </div>
    <div class="buttons">
      <button class="btn btn-secondary" onclick="resetAll()">
        🔄 重置数据
      </button>
      <button class="btn btn-primary" onclick="window.print()">
        🖨️ 打印报告
      </button>
    </div>
  </div>
</div>

<!-- Mobile detection badge -->
<div id="mobile-badge">📱 移动端版本</div>

<script>
const dimensions = [
  {id:1,name:'数感与运算能力',desc:'计算准度、速度、数量推理',icon:'🧮'},
  {id:2,name:'空间几何能力',desc:'拼图、立体搭建、图形重组',icon:'🧩'},
  {id:3,name:'观察辨识能力',desc:'图形细节、差异识别、特征观察',icon:'🔍'},
  {id:4,name:'逻辑推理能力',desc:'模式识别、序列推理、逻辑判断',icon:'🧠'},
  {id:5,name:'生活应用能力',desc:'实际问题解决、情境计算',icon:'🛒'},
  {id:6,name:'专注力与习惯',desc:'注意力集中、题目理解、学习态度',icon:'⏳'}
];

// Build items
function buildItems() {
  const container = document.getElementById('items-container');
  container.innerHTML = dimensions.map(dim => `
    <div class="assessment-item" data-id="${dim.id}">
      <div class="item-header">
        <div class="item-icon">${dim.icon}</div>
        <div class="item-info">
          <h3>${dim.id}. ${dim.name}</h3>
          <p>${dim.desc}</p>
        </div>
      </div>
      
      <div class="input-row">
        <label>题目序号</label>
        <input type="text" class="question-input" data-id="${dim.id}" placeholder="如: 1,2,3-5">
      </div>
      
      <div class="input-row">
        <label>正确率 (%)</label>
        <input type="number" min="0" max="100" class="accuracy-input" data-id="${dim.id}" 
               placeholder="0-100" oninput="onAccuracyChange(${dim.id})">
        <div class="score-row">
          <div class="score-cell">
            <div class="auto-score" id="auto-${dim.id}">0</div>
            <div style="text-align:center; font-size:0.75rem; color:#94a3b8; margin-top:4px;">自动评分</div>
          </div>
          <div class="score-cell">
            <label style="margin-bottom:4px;">手动得分</label>
            <input type="number" min="0" max="20" class="score-input" data-id="${dim.id}" 
                   value="0" placeholder="0-20" oninput="onScoreChange(${dim.id})">
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

// Accuracy to score conversion
function accuracyToScore(acc) {
  if (acc >= 95) return 20;
  if (acc >= 90) return 19;
  if (acc >= 85) return 18;
  if (acc >= 80) return 17;
  if (acc >= 75) return 16;
  if (acc >= 70) return 15;
  if (acc >= 65) return 13;
  if (acc >= 60) return 12;
  if (acc >= 55) return 11;
  if (acc >= 50) return 10;
  if (acc >= 45) return 9;
  if (acc >= 40) return 8;
  if (acc >= 35) return 7;
  if (acc >= 30) return 6;
  if (acc >= 25) return 5;
  if (acc >= 20) return 4;
  if (acc >= 15) return 3;
  if (acc >= 10) return 2;
  if (acc >= 5) return 1;
  if (acc > 0) return 1;
  return 0;
}

function onAccuracyChange(id) {
  const input = document.querySelector(`.accuracy-input[data-id="${id}"]`);
  let value = parseInt(input.value) || 0;
  value = Math.min(100, Math.max(0, value));
  
  // Auto score
  const autoScore = accuracyToScore(value);
  document.getElementById(`auto-${id}`).textContent = autoScore;
  
  // Sync to score input
  const scoreInput = document.querySelector(`.score-input[data-id="${id}"]`);
  if (scoreInput) {
    scoreInput.value = autoScore;
  }
  
  calculateAll();
}

function onScoreChange(id) {
  const input = document.querySelector(`.score-input[data-id="${id}"]`);
  let value = parseInt(input.value) || 0;
  value = Math.min(20, Math.max(0, value));
  input.value = value;
  calculateAll();
}

function calculateAll() {
  let totalScore = 0;
  let totalAccuracy = 0;
  let countAccuracy = 0;
  
  const items = dimensions.map(dim => {
    const scoreInput = document.querySelector(`.score-input[data-id="${dim.id}"]`);
    const accInput = document.querySelector(`.accuracy-input[data-id="${dim.id}"]`);
    const score = parseInt(scoreInput?.value) || 0;
    const accuracy = parseInt(accInput?.value) || 0;
    
    totalScore += score;
    if (accuracy > 0) {
      totalAccuracy += accuracy;
      countAccuracy++;
    }
    
    return { ...dim, score, accuracy };
  });
  
  const avgAccuracy = countAccuracy > 0 ? Math.round(totalAccuracy / countAccuracy) : 0;
  
  // Update stats
  document.getElementById('stat-total').querySelector('.value').textContent = totalScore;
  document.getElementById('stat-avg').querySelector('.value').textContent = avgAccuracy + '%';
  
  const level = totalScore >= 100 ? '卓越' : totalScore >= 80 ? '优秀' : totalScore >= 60 ? '良好' : '待提升';
  document.getElementById('stat-level').querySelector('.value').textContent = totalScore > 0 ? level : '--';
  
  // Update final
  document.getElementById('final-total').textContent = totalScore;
  document.getElementById('final-level').textContent = totalScore > 0 ? level : '待测评';
  
  // Analysis
  if (totalScore > 0) {
    const sorted = [...items].sort((a,b) => b.score - a.score);
    const top2 = sorted.slice(0,2);
    const bottom2 = sorted.slice(-2);
    
    document.getElementById('analysis-strength').textContent = 
      top2.length > 0 ? `孩子最擅长 ${top2.map(x => x.name).join('、')}，得分很高！` : '暂无数据';
    
    document.getElementById('analysis-weakness').textContent = 
      bottom2.length > 0 ? `可以在 ${bottom2.map(x => x.name).join('、')} 方面多练习` : '表现均衡';
    
    document.getElementById('analysis-suggestion').textContent = 
      '建议每天玩10分钟数学游戏，在生活场景中练习，培养兴趣更重要！';
  }
}

function resetAll() {
  if (confirm('重置所有数据？')) {
    document.querySelectorAll('.question-input, .accuracy-input, .score-input').forEach(input => {
      if (input.classList.contains('score-input')) {
        input.value = '0';
      } else {
        input.value = '';
      }
    });
    document.querySelectorAll('.auto-score').forEach(el => el.textContent = '0');
    calculateAll();
  }
}

// Initialize
buildItems();
calculateAll();

// Show mobile badge
setTimeout(() => {
  const badge = document.getElementById('mobile-badge');
  if (window.innerWidth < 768) {
    badge.style.display = 'block';
  } else {
    badge.style.display = 'none';
  }
}, 100);
</script>
</body>
</html>
